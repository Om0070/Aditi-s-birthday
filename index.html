<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday 🎉</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600&display=swap" rel="stylesheet">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Poppins', sans-serif;
}

body {
  height: 100vh;
  background: radial-gradient(circle at top, #ffb3c6, #ff4d6d);
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: hidden;
}

/* Instagram Reel frame */
.reel {
  width: 100%;
  max-width: 430px;
  aspect-ratio: 9 / 16;
  background: linear-gradient(180deg, #ff8fab, #ff4d6d);
  border-radius: 20px;
  box-shadow: 0 20px 50px rgba(0,0,0,0.4);
  position: relative;
  overflow: hidden;
}

.container {
  text-align: center;
  padding: 20px;
  animation: fadeIn 2s ease forwards;
}

/* 🎂 CAKE */
.cake {
  position: relative;
  width: 220px;
  margin: 60px auto 20px;
}

.layer {
  border-radius: 20px;
  box-shadow: inset 0 -8px rgba(0,0,0,0.08);
  margin: auto;
}

.bottom {
  width: 220px;
  height: 80px;
  background: #f3b6c4;
}

.middle {
  width: 180px;
  height: 70px;
  background: #ffd6e0;
  margin-top: -20px;
}

.top {
  width: 140px;
  height: 60px;
  background: #fff;
  margin-top: -18px;
  position: relative;
}

/* Cream drip */
.drip {
  position: absolute;
  top: 50px;
  width: 100%;
  height: 20px;
  background: #fff;
  border-radius: 0 0 20px 20px;
}

.drip span {
  position: absolute;
  width: 12px;
  height: 25px;
  background: #fff;
  border-radius: 0 0 10px 10px;
  animation: drip 2s infinite alternate;
}

.drip span:nth-child(1){left:20px}
.drip span:nth-child(2){left:60px;animation-delay:.4s}
.drip span:nth-child(3){left:100px;animation-delay:.8s}

/* Candle */
.candle {
  position: absolute;
  top: -35px;
  left: 50%;
  transform: translateX(-50%);
  width: 10px;
  height: 35px;
  background: repeating-linear-gradient(
    45deg,
    #fff,
    #fff 4px,
    #ff8fab 4px,
    #ff8fab 8px
  );
  border-radius: 5px;
}

.flame {
  position: absolute;
  top: -18px;
  left: 50%;
  transform: translateX(-50%);
  width: 14px;
  height: 18px;
  background: radial-gradient(circle, #fff176, #ff9800, #ff5722);
  border-radius: 50%;
  animation: flicker .2s infinite alternate;
}

/* Text */
h1 {
  color: white;
  font-size: 1.8rem;
  margin-top: 20px;
}

.subtitle {
  color: white;
  opacity: .9;
  margin-top: 6px;
}

/* Typewriter */
.typewriter {
  white-space: nowrap;
  overflow: hidden;
  border-right: 2px solid white;
  width: 0;
  animation: typing 3s steps(30) forwards, blink .8s infinite;
}

/* Button */
button {
  margin-top: 25px;
  padding: 12px 28px;
  border-radius: 30px;
  border: none;
  background: white;
  color: #ff4d6d;
  font-weight: bold;
  cursor: pointer;
  box-shadow: 0 12px 25px rgba(0,0,0,0.3);
}

/* Fireworks */
.firework {
  position: absolute;
  width: 6px;
  height: 6px;
  border-radius: 50%;
  animation: explode 1.5s ease-out infinite;
}

/* Animations */
@keyframes typing { to { width: 100%; } }
@keyframes blink { 50% { border-color: transparent; } }
@keyframes flicker { from { transform: translateX(-50%) scale(1); } to { transform: translateX(-50%) scale(1.2); } }
@keyframes drip { from { height: 18px; } to { height: 26px; } }
@keyframes fadeIn { from { opacity: 0; transform: scale(.9); } to { opacity: 1; } }

@keyframes explode {
  0% { transform: scale(0); opacity: 1; }
  100% { transform: scale(8); opacity: 0; }
}
</style>
</head>

<body>

<div class="reel" id="reel">
  <div class="container">

    <div class="cake">
      <div class="top">
        <div class="drip"><span></span><span></span><span></span></div>
        <div class="candle"><div class="flame"></div></div>
      </div>
      <div class="middle layer"></div>
      <div class="bottom layer"></div>
    </div>

    <h1 class="typewriter">Happy Birthday Aditi 💖</h1>
    <p class="subtitle">Bestie forever ✨</p>

    <button onclick="startParty()">▶ Tap to Celebrate</button>
  </div>
</div>

<audio id="song">
  <source src="https://assets.mixkit.co/music/preview/mixkit-happy-birthday-to-you-320.mp3" type="audio/mpeg">
</audio>

<script>
const song = document.getElementById("song");
const reel = document.getElementById("reel");

function startParty() {
  song.play();
  setInterval(createFirework, 500);
}

function createFirework() {
  const fw = document.createElement("div");
  fw.className = "firework";
  fw.style.left = Math.random() * 100 + "%";
  fw.style.top = Math.random() * 60 + "%";
  fw.style.backgroundColor = `hsl(${Math.random()*360},100%,70%)`;
  reel.appendChild(fw);

  setTimeout(() => fw.remove(), 1500);
}
</script>

</body>
</html>
