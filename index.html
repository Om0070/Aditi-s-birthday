<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday 🎉</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600&display=swap" rel="stylesheet">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Poppins', sans-serif;
}

body {
  height: 100vh;
  background: linear-gradient(135deg, #ffdde1, #ee9ca7);
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: hidden;
  text-align: center;
}

.container {
  animation: fadeIn 2s ease forwards;
  padding: 20px;
}

.candle {
  display: flex;
  justify-content: center;
  margin-bottom: -15px;
}

.flame {
  width: 10px;
  height: 25px;
  margin: 0 4px;
  background: radial-gradient(circle, #fff176, #ff9800, #ff5722);
  border-radius: 50%;
  animation: flicker 0.2s infinite alternate;
}

.cake {
  width: 200px;
  margin: 15px auto;
  animation: float 3s ease-in-out infinite;
}

h1 {
  color: #fff;
  font-size: 1.8rem;
  margin-top: 10px;
}

.subtitle {
  color: #fff;
  opacity: 0.9;
  font-size: 1rem;
}

.typewriter {
  overflow: hidden;
  white-space: nowrap;
  border-right: 2px solid white;
  width: 0;
  animation: typing 3s steps(30) forwards, blink 0.8s infinite;
}

button {
  margin-top: 20px;
  padding: 10px 25px;
  border: none;
  border-radius: 25px;
  background: #fff;
  color: #ff5f8a;
  font-weight: bold;
  cursor: pointer;
  box-shadow: 0 10px 25px rgba(0,0,0,0.2);
  transition: transform 0.2s;
}

button:hover {
  transform: scale(1.1);
}

/* Popup */
.popup {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.5);
  display: none;
  justify-content: center;
  align-items: center;
}

.popup-box {
  background: white;
  padding: 25px;
  border-radius: 15px;
  max-width: 300px;
  animation: pop 0.4s ease;
}

/* Confetti */
#confetti span {
  position: absolute;
  width: 8px;
  height: 8px;
  animation: fall linear infinite;
}

/* Animations */
@keyframes typing {
  to { width: 100%; }
}

@keyframes blink {
  50% { border-color: transparent; }
}

@keyframes flicker {
  from { transform: scale(1); }
  to { transform: scale(1.2); }
}

@keyframes float {
  50% { transform: translateY(-10px); }
}

@keyframes fadeIn {
  from { opacity: 0; transform: scale(0.9); }
  to { opacity: 1; transform: scale(1); }
}

@keyframes fall {
  to { transform: translateY(110vh) rotate(360deg); }
}

@keyframes pop {
  from { transform: scale(0.5); }
  to { transform: scale(1); }
}

@media (max-width: 480px) {
  h1 { font-size: 1.4rem; }
  .cake { width: 160px; }
}
</style>
</head>

<body>

<div id="confetti"></div>

<div class="container">

  <div class="candle">
    <div class="flame"></div>
    <div class="flame"></div>
    <div class="flame"></div>
  </div>

  <svg class="cake" viewBox="0 0 200 200">
    <rect x="30" y="80" rx="10" ry="10" width="140" height="60" fill="#f6c1cc"/>
    <rect x="40" y="50" rx="10" ry="10" width="120" height="40" fill="#ffd6e0"/>
    <rect x="50" y="30" rx="10" ry="10" width="100" height="30" fill="#fff"/>
  </svg>

  <h1 class="typewriter">Happy Birthday Aditi 🤍</h1>
  <p class="subtitle">You make life sweeter 🎂✨</p>

  <button onclick="showPopup()">Tap for Surprise 💌</button>
</div>

<div class="popup" id="popup">
  <div class="popup-box">
    <h3>🎉 Surprise!</h3>
    <p>You’re not just my bestie,<br>you’re my favorite person 💖<br>Stay amazing forever ✨</p>
    <button onclick="closePopup()">Close</button>
  </div>
</div>

<audio id="music">
  <source src="https://assets.mixkit.co/music/preview/mixkit-happy-birthday-to-you-320.mp3" type="audio/mpeg">
</audio>

<script>
// Confetti
const confetti = document.getElementById("confetti");
for (let i = 0; i < 90; i++) {
  const c = document.createElement("span");
  c.style.left = Math.random() * 100 + "vw";
  c.style.animationDuration = Math.random() * 3 + 2 + "s";
  c.style.backgroundColor = `hsl(${Math.random()*360},100%,70%)`;
  confetti.appendChild(c);
}

// Popup + Music
const music = document.getElementById("music");

function showPopup() {
  document.getElementById("popup").style.display = "flex";
  music.play();
}

function closePopup() {
  document.getElementById("popup").style.display = "none";
}
</script>

</body>
</html>
