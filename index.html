<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday 🎉</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Poppins,sans-serif}

body{
  height:100vh;
  background:radial-gradient(circle at top,#ffb3c6,#ff4d6d);
  display:flex;
  justify-content:center;
  align-items:center;
  overflow:hidden;
}

/* Instagram Reel */
.reel{
  width:100%;
  max-width:430px;
  aspect-ratio:9/16;
  background:linear-gradient(180deg,#ff8fab,#ff4d6d);
  border-radius:20px;
  position:relative;
  overflow:hidden;
}

.container{text-align:center;padding:20px}

/* 🎂 Cake */
.cake{position:relative;width:220px;margin:60px auto 20px}

.layer{border-radius:20px;box-shadow:inset 0 -8px rgba(0,0,0,.1);margin:auto}
.bottom{width:220px;height:80px;background:#f3b6c4}
.middle{width:180px;height:70px;background:#ffd6e0;margin-top:-20px}
.top{width:140px;height:60px;background:#fff;margin-top:-18px;position:relative}

/* Cream drip */
.drip{position:absolute;top:50px;width:100%;height:20px;background:#fff;border-radius:0 0 20px 20px}
.drip span{position:absolute;width:12px;height:25px;background:#fff;border-radius:0 0 10px 10px}
.drip span:nth-child(1){left:20px}
.drip span:nth-child(2){left:60px}
.drip span:nth-child(3){left:100px}

/* Candle */
.candle{
  position:absolute;top:-35px;left:50%;
  transform:translateX(-50%);
  width:10px;height:35px;
  background:repeating-linear-gradient(
    45deg,#fff,#fff 4px,#ff8fab 4px,#ff8fab 8px
  );
  border-radius:5px;
}
.flame{
  position:absolute;top:-18px;left:50%;
  transform:translateX(-50%);
  width:14px;height:18px;
  background:radial-gradient(circle,#fff176,#ff9800,#ff5722);
  border-radius:50%;
  animation:flicker .2s infinite alternate;
}

/* 🌟 NAME ANIMATION */
.name{
  font-size:1.9rem;
  color:white;
  margin-top:20px;
  animation:floatName 3s ease-in-out infinite,
           glow 2s ease-in-out infinite alternate;
}

.name.celebrate{
  animation:celebrateName 0.8s ease forwards;
}

/* Subtitle */
.subtitle{color:white;opacity:.9;margin-top:6px}

/* Button */
button{
  margin-top:25px;
  padding:12px 30px;
  border-radius:30px;
  border:none;
  background:white;
  color:#ff4d6d;
  font-weight:bold;
  cursor:pointer;
  box-shadow:0 12px 25px rgba(0,0,0,.3);
}

/* Fireworks */
.firework{
  position:absolute;
  width:6px;height:6px;
  border-radius:50%;
  animation:explode 1.5s ease-out forwards;
}

/* Animations */
@keyframes flicker{
  to{transform:translateX(-50%) scale(1.2)}
}

@keyframes explode{
  to{transform:scale(8);opacity:0}
}

@keyframes floatName{
  50%{transform:translateY(-6px)}
}

@keyframes glow{
  from{text-shadow:0 0 10px #fff}
  to{text-shadow:0 0 25px #ffd6e0}
}

@keyframes celebrateName{
  0%{transform:scale(1)}
  50%{transform:scale(1.3) rotate(2deg)}
  100%{transform:scale(1)}
}
</style>
</head>

<body>

<div class="reel" id="reel">
  <div class="container">

    <div class="cake">
      <div class="top">
        <div class="drip"><span></span><span></span><span></span></div>
        <div class="candle">
          <div class="flame" id="flame"></div>
        </div>
      </div>
      <div class="middle layer"></div>
      <div class="bottom layer"></div>
    </div>

    <!-- 🌟 NAME -->
    <h1 class="name" id="name">Happy Birthday Aditi 💖</h1>
    <p class="subtitle" id="msg">Make a wish ✨</p>

    <button onclick="startCelebration()">🎉 Tap to Celebrate</button>
  </div>
</div>

<audio id="song">
  <source src="https://assets.mixkit.co/music/preview/mixkit-happy-birthday-to-you-320.mp3">
</audio>

<script>
const song = document.getElementById("song");
const reel = document.getElementById("reel");
const flame = document.getElementById("flame");
const nameEl = document.getElementById("name");
const msg = document.getElementById("msg");

let fireworksStarted = false;

function startCelebration(){

  /* Play song */
  song.play();

  /* Blow candle */
  flame.style.display="none";

  /* Name celebration animation */
  nameEl.classList.add("celebrate");

  /* Change text */
  msg.innerText="🎂 Wish Granted! Besties forever 💕";

  /* Fireworks */
  if(!fireworksStarted){
    fireworksStarted=true;
    setInterval(createFirework,500);
  }
}

function createFirework(){
  const fw=document.createElement("div");
  fw.className="firework";
  fw.style.left=Math.random()*100+"%";
  fw.style.top=Math.random()*60+"%";
  fw.style.backgroundColor=
    `hsl(${Math.random()*360},100%,70%)`;

  reel.appendChild(fw);
  setTimeout(()=>fw.remove(),1500);
}
</script>

</body>
</html>
